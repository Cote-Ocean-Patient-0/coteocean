<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050807">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PATIENT ZERO – Escape Game</title>

  <style>
    /* =========================================================
       VARIABLES DE LA CHARTE (ambiance laboratoire / sci-fi)
       ========================================================= */
    :root {
      --bg: #050807;
      --panel: #0c1512;
      --panel-2: #101d18;
      --text: #e8f3ee;
      --muted: #a3bcb1;
      --neon: #39ff88;
      --neon-soft: rgba(57, 255, 136, 0.35);
      --neon-faint: rgba(57, 255, 136, 0.08);
      --danger: #ff4040;
      --danger-soft: rgba(255, 64, 64, 0.45);
      --radius: 12px;
      --maxw: 440px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(57, 255, 136, 0.10), transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(255, 64, 64, 0.06), transparent 55%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }

    /* Effet "scanlines" d'écran de labo (purement décoratif) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.025) 0px,
        rgba(255, 255, 255, 0.025) 1px,
        transparent 1px,
        transparent 3px
      );
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: var(--maxw);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ---------- Logo ---------- */
    .logo {
      display: block;
      width: 80%;
      max-width: 320px;
      height: auto;
      margin: 8px auto 24px;
      filter: drop-shadow(0 0 12px var(--neon-soft));
    }

    /* ---------- Phases ---------- */
    .phase { width: 100%; }
    .phase[hidden] { display: none !important; }

    /* ---------- Boutons principaux ---------- */
    .btn {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 100%;
      min-height: 60px;
      margin: 0 auto 20px;
      padding: 16px 20px;
      border: 2px solid var(--neon);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(57, 255, 136, 0.14), rgba(57, 255, 136, 0.04));
      color: var(--neon);
      font-family: var(--font);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--neon-soft);
      box-shadow: 0 0 14px var(--neon-soft), inset 0 0 14px var(--neon-faint);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
      touch-action: manipulation;
    }
    .btn:hover { box-shadow: 0 0 22px var(--neon-soft), inset 0 0 18px var(--neon-faint); }
